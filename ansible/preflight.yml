---
# preflight.yml
# Entry-point duy nhat - chay DAU TIEN moi phien lam viec.
#
#   cd ~/network_automation/spine-leaf-mini/ansible
#   ansible-playbook preflight.yml -K        # -K: hoi mat khau sudo (containerlab can sudo)
#   ansible-playbook preflight.yml -K --check   # che do xem truoc: chi bao cao, khong sua gi
#
# Day 4: file nay gio chi con la ban "dieu phoi" - moi play goi 1 role trong
# roles/, logic chi tiet nam het trong do (xem roles/<ten_role>/tasks/main.yml).
# Loi ich: de doc (biet ngay play nao lam gi), va infra_recovery/bgp_check co
# the tai su dung gan nguyen khi scale len ban 20 thiet bi, chi doi inventory.

# ============================================================================
# PLAY 1 - Ha tang container: kiem tra, deploy lai neu can, khoi phuc node Linux
# ============================================================================
- name: "1/3 Khoi phuc ha tang container (containerlab + node Linux)"
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - infra_recovery

# ============================================================================
# PLAY 2 - Kiem chung control-plane: BGP phai Established du so neighbor
# ============================================================================
- name: "2/3 Xac nhan BGP tren 6 switch (dong thoi kiem chung SSH-key con song)"
  hosts: ceos
  gather_facts: false
  vars:
    # Play nay chay tren nhom "ceos", khac host voi Play 1 ("localhost"), nen
    # phai lay bien qua hostvars - 2 host khong tu chia se fact cho nhau.
    skip_live_checks: "{{ hostvars['localhost'].skip_live_checks | default(false) }}"
  roles:
    - bgp_check

# ============================================================================
# PLAY 3 - Tang ung dung: MySQL tren db01, client tren web01, test xuyen fabric
# ============================================================================
- name: "3/3 Chuan bi tang ung dung (MySQL) va test xuyen fabric"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault.yml   # nap vault_app_password (ma hoa) - dung boi role app_layer
  roles:
    - app_layer
